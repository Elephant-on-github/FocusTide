[package]
name = "focustide"
version = "1.7.0"
description = "Modern and customizable productivity timer"
authors = ["FocusTide"]
edition = "2021"

[lib]
name = "focustide_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
